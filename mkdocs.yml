site_name: Język polski po ludzku
site_description: Język polski wyjaśniony jasno, konkretnie i interaktywnie
site_url: ""

theme:
  name: material
  language: pl
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Włącz tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Włącz tryb jasny

extra_css:
  - stylesheets/extra.css
  - stylesheets/noun-lesson.css
  - stylesheets/verb-lesson.css
  - stylesheets/remaining-parts.css
  - stylesheets/lesson-style-compat.css
  - stylesheets/indeclinable-parts.css

plugins:
  - search:
      lang: pl

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Start: index.md
  - Gramatyka:
      - Przegląd: gramatyka/index.md
      - Podstawy gramatyki: gramatyka/podstawy/index.md
      - Części mowy:
