site_name: Język polski po ludzku
site_description: Język polski wyjaśniony jasno, konkretnie i interaktywnie
site_url: ""

theme:
  name: material
  language: pl
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Włącz tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Włącz tryb jasny

extra_css:
  - stylesheets/extra.css
  - stylesheets/noun-lesson.css
  - stylesheets/verb-lesson.css

plugins:
  - search:
      lang: pl

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Start: index.md
  - Gramatyka:
      - Przegląd: gramatyka/index.md
      - Podstawy gramatyki: gramatyka/podstawy/index.md
      - Części mowy:
          - Przegląd: gramatyka/czesci-mowy/index.md
          - Czasownik:
              - Wprowadzenie: gramatyka/czesci-mowy/czasownik/index.md
              - Znaczenie i rozpoznawanie: gramatyka/czesci-mowy/czasownik/znaczenie-i-rozpoznawanie.md
              - Osoby i liczby: gramatyka/czesci-mowy/czasownik/osoby-i-liczby.md
              - Czasy: gramatyka/czesci-mowy/czasownik/czasy.md
              - Aspekt: gramatyka/czesci-mowy/czasownik/aspekt.md
              - Tryby: gramatyka/czesci-mowy/czasownik/tryby.md
              - Strony i formy nieosobowe: gramatyka/czesci-mowy/czasownik/strony-i-formy-nieosobowe.md
              - Czasowniki w tekście: gramatyka/czesci-mowy/czasownik/czasowniki-w-tekscie.md
          - Rzeczownik:
              - Wprowadzenie: gramatyka/czesci-mowy/rzeczownik/index.md
              - Znaczenie i typy: gramatyka/czesci-mowy/rzeczownik/znaczenie-i-typy.md
              - Rodzaj i liczba: gramatyka/czesci-mowy/rzeczownik/rodzaj-i-liczba.md
              - Przypadki i odmiana: gramatyka/czesci-mowy/rzeczownik/przypadki-i-odmiana.md
              - Rzeczownik w zdaniu: gramatyka/czesci-mowy/rzeczownik/rzeczownik-w-zdaniu.md
              - Słowotwórstwo i pisownia: gramatyka/czesci-mowy/rzeczownik/slowotworstwo-i-pisownia.md
              - Rzeczowniki w tekście: gramatyka/czesci-mowy/rzeczownik/rzeczowniki-w-tekscie.md
          - Przymiotnik: gramatyka/czesci-mowy/przymiotnik/index.md
          - Zaimki: gramatyka/czesci-mowy/zaimki/index.md
      - Fleksja: gramatyka/fleksja/index.md
      - Składnia: gramatyka/skladnia/index.md
      - Słowotwórstwo: gramatyka/slowotworstwo/index.md
  - Czytanie i analiza w praktyce:
      - Wprowadzenie: praktyka/index.md
      - Tajemnica Szklanego Lasu: praktyka/interaktywna-analiza-czesci-mowy.md
  - Materiały dodatkowe: materialy-dodatkowe/index.md
  - Archiwum PDF: pdf/index.md
