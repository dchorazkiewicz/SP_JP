site_name: Dokumentacja języka polskiego
site_description: Materiały dydaktyczne do nauki gramatyki języka polskiego
site_url: ""

theme:
  name: material
  language: pl
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Włącz tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Włącz tryb jasny

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pl

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Start: index.md
  - Gramatyka:
      - Wprowadzenie: gramatyka/index.md
      - Czasownik: gramatyka/czasownik/index.md
      - Przymiotnik: gramatyka/przymiotnik/index.md
      - Rzeczownik: gramatyka/rzeczownik/index.md
      - Zaimki: gramatyka/zaimki/index.md
  - Materiały dodatkowe: materialy-dodatkowe/index.md
  - Archiwum PDF: pdf/index.md
